site_name: AWS SAA 通勤复习
site_description: 面向 iPhone 通勤场景的 AWS SAA-C03 中文复习资料
site_url: https://vernezhong.github.io/saa-docs/
repo_url: https://github.com/VerneZhong/saa-docs
repo_name: VerneZhong/saa-docs
docs_dir: .site-docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: material/cloud-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 通勤首页: index.md
  - 5 分钟速记: 09-考前90分钟速记.md
  - 高频速查: 02-高频服务速查.md
  - 易混服务对比: 08-易混淆服务对比.md
  - 场景题决策:
      - 架构题模板: 03-架构场景题模板.md
      - 服务选择决策树: 07-服务选择决策树.md
  - 刷题与复盘:
      - 中文模拟题: 05-模拟题.md
      - 错题本模板: 04-错题本模板.md
  - 系统学习:
      - 4 周路线图: 01-备考路线图.md
      - 完整考点笔记: 06-完整考点笔记.md
      - 查漏补缺: 11-查漏补缺与边界条件.md
  - 日本求职: 10-日语面试表达-AWS架构.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - assets/stylesheets/mobile.css

extra_javascript:
  - assets/javascripts/mobile-study.js
  - assets/javascripts/register-sw.js

copyright: 非官方 SAA-C03 复习资料 · 服务能力变化时以 AWS 官方文档为准
